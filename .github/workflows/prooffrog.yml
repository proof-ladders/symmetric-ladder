on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-prooffrog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.2

      - name: Setup ProofFrog
        uses: threeal/pipx-install-action@v1.0.0
        with:
          packages: proof_frog

      - name: Check proof
        run: proof_frog prove PRG/ProofFrog/TriplingPRGSecure.proof
